<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кабинет координатора · Музейный компас</title>
<style>body{font:16px system-ui;background:#f7f4ee;color:#212c2b;max-width:1200px;margin:auto;padding:24px}input,select,button{font:inherit;padding:10px;margin:5px;border:1px solid #bbb;border-radius:6px}button{cursor:pointer}table{border-collapse:collapse;width:100%;background:white}td,th{padding:12px;border-bottom:1px solid #ddd;text-align:left}article{padding:20px;background:white;margin:18px 0;border-radius:12px}#detail{font-size:15px}#detail table{table-layout:fixed}#detail th,#detail td{overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere}.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}.bar{background:#1e6564;height:10px;min-width:1px}#error{color:#a00}dialog{max-width:90vw;max-height:85vh;overflow:auto} @media(max-width:650px){body{padding:10px}table{font-size:13px}td,th{padding:6px}}</style>
<h1>Кабинет координатора</h1><p>Источник: SQLite. Фильтр дат использует UTC. Пилотная шкала не утверждена ГИМ. Ничья означает одинаковую оценку. Неоценённые анкеты требуют отдельного разбора. Решение принимает человек.</p>
<form id="login"><label>Ключ доступа <input id="token" type="password" autocomplete="off" required></label><button>Войти</button></form><button id="logout">Выйти</button><p id="error" role="alert"></p>
<section id="workspace" hidden><article><label>От <input type="date" id="from"></label><label>До <input type="date" id="to"></label><label>Направление <select id="direction"><option value="">Все</option><option value="organizational">Организационное</option><option value="project">Проектное</option><option value="collections">Фондовое</option><option value="inclusive">Инклюзивное</option><option value="media">Медиа</option><option value="undecided">Не определился</option></select></label><label>Режим <select id="mode"><option value="">Все</option><option>llm</option><option>rules_demo</option></select></label><label>Статус оценки <input id="scoreStatus" placeholder="Все"></label><button id="apply">Применить</button></article>
<p id="meta"></p><div class="bars" id="charts"></div><article><label>Очередь <select id="queue"><option value="all">Все</option><option value="rated">Оценённые</option><option value="unrated">Без оценки</option></select></label><label>Сортировка <select id="sort"><option value="score_desc">Оценка по убыванию</option><option value="score_asc">Оценка по возрастанию</option><option value="created_at">Дата</option></select></label><button id="csv">Скачать все анкеты CSV</button><div style="overflow:auto"><table><thead><tr><th>Анкета</th><th>Дата</th><th>Балл</th><th>Статус / критерии</th><th>Кратко</th></tr></thead><tbody id="rows"></tbody></table></div><button id="prev">Назад</button><span id="page"></span><button id="next">Далее</button></article></section>
<dialog id="card"><button id="close">Закрыть</button><h2 id="cardTitle"></h2><button id="oneCsv">CSV анкеты</button><div id="detail"></div></dialog>
<script>
let key='',page=1,total=0,currentId='';const $=id=>document.getElementById(id);
async function req(path){const r=await fetch(path,{headers:{Authorization:'Bearer '+key},cache:'no-store'});if(!r.ok)throw Error('Запрос не выполнен: '+r.status);return r;}
function filters(){const p=new URLSearchParams();for(const [id,name] of [['from','date_from'],['to','date_to'],['direction','direction'],['mode','mode'],['scoreStatus','score_status']])if($(id).value)p.set(name,$(id).value);return p;}
const labels={unknown:'Без оценки',organizational:'Организационное',project:'Проектное',collections:'Фондовое',inclusive:'Инклюзивное',media:'Медиа',undecided:'Не определился',llm:'ИИ',rules_demo:'Демонстрация',failed:'Ошибка доставки',synced:'Сохранено',pending:'Ожидает',syncing:'Синхронизация',pilot_unvalidated:'Пилотный балл',insufficient_evidence:'Недостаточно сведений',not_calibrated:'Демо без балла',legacy_unknown:'Версия неизвестна'};
function text(tag,value){const e=document.createElement(tag);e.textContent=value;return e;}
async function download(path,name){const r=await req(path),url=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function openCard(id){currentId=id;const d=await (await req('/api/v1/applications/'+encodeURIComponent(id))).json();$('cardTitle').textContent=id;$('detail').innerHTML=d.card_html;$('card').showModal();}
async function load(){try{$('error').textContent='';const p=filters();p.set('sort',$('sort').value);p.set('queue',$('queue').value);p.set('page',page);p.set('page_size',25);const [list,a]=await Promise.all([(await req('/api/v1/admin/applications?'+p)).json(),(await req('/api/v1/admin/analytics?'+filters())).json()]);total=list.total;$('workspace').hidden=false;$('meta').textContent=`Выборка: ${a.total}. Оценено: ${a.rated_count}. Без оценки: ${a.unrated_count}. Построено: ${a.generated_at}`;$('rows').replaceChildren();for(const r of list.items){const tr=document.createElement('tr'),td=document.createElement('td'),b=text('button',r.applicant_name+' · '+r.application_id);b.onclick=()=>openCard(r.application_id).catch(show);td.append(b);tr.append(td,text('td',r.created_at.slice(0,10)),text('td',r.score===null?'Без оценки':r.score+(r.tied?' · ничья':'')),text('td',(labels[r.evaluation.score_status]||r.evaluation.score_status||'Версия неизвестна')+' / '+r.rated_criteria_count+' из 5'),text('td',r.evaluation.summary||''));$('rows').append(tr);} $('page').textContent=`Страница ${page} · ${total} анкет`;$('prev').disabled=page===1;$('next').disabled=page*25>=total;$('charts').replaceChildren();for(const [metric,label] of [['score','Оценки'],['desired_direction','Выбранное направление'],['evaluation_mode','Режим'],['sheet_sync_status','Доставка Sheets']]){const box=text('article',label+' · n='+a[metric].denominator);for(const [v,n] of Object.entries(a[metric].counts)){box.append(text('p',(labels[v]||v)+': '+n));const bar=document.createElement('div');bar.className='bar';bar.style.width=(100*n/Math.max(a.total,1))+'%';box.append(bar);}$('charts').append(box);}}catch(e){show(e);}}
function show(e){$('error').textContent=e.message;}
$('login').onsubmit=e=>{e.preventDefault();key=$('token').value;$('token').value='';load();};$('logout').onclick=()=>{key='';$('workspace').hidden=true;$('rows').replaceChildren();$('charts').replaceChildren();$('detail').textContent='';$('card').close();};$('apply').onclick=()=>{page=1;load();};for(const id of ['sort','queue'])$(id).onchange=()=>{page=1;load();};$('prev').onclick=()=>{page--;load();};$('next').onclick=()=>{page++;load();};$('close').onclick=()=>$('card').close();$('oneCsv').onclick=()=>download('/api/v1/admin/applications/'+encodeURIComponent(currentId)+'/export.csv','gim-application.csv').catch(show);$('csv').onclick=()=>download('/api/v1/export.csv','gim-all-applications.csv').catch(show);
</script></html>
